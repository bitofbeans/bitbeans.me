<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>contact — bitofbeans</title>
        <style>
            @import url(/global.css);

            .tooltip {
                position: relative;
            }
            .tooltip .tooltiptext {
                visibility: hidden;
                width: 120px;
                background-color: #e392f7e5;
                color: #fff;
                text-align: center;
                border-radius: 6px;
                padding: 5px 0;
                font-size: small;

                /* Position the tooltip */
                position: absolute;
                z-index: 1;
                bottom: 100%;
                left: 50%;
                margin-left: -60px;
            }

            .tooltip:hover .tooltiptext {
                visibility: visible;
            }
        </style>
    </head>
    <body>
        <main>
            <a class="back" href="../">← Back</a>
            <h1>Contact</h1>
            <p>Best way to contact me is by discord. Click it to copy my discord username.</p>
            <div class="link-container">
                <a href="https://github.com/bitofbeans">github</a>
                <div class="tooltip">
                    <a onclick="copyToClipboard('BitBeans#2388')">discord</a>
                    <span class="tooltiptext">Copy to Clipboard</span>
                </div>
                <a href="mailto:bu@bitbeans.me">email</a>
            </div>
        </main>
        <script>
            function copyToClipboard(input) {
                navigator.clipboard.writeText(input);
            }
        </script>
    </body>
</html>
